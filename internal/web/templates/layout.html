<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Documentos FRL</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f2f4f6; color: #1a1a1a; }
  header { background: #163a5c; color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
  header a.marca { color: white; text-decoration: none; font-weight: 700; font-size: 1.1rem; }
  form.busca { display: flex; gap: 0.4rem; }
  form.busca input[type=text] { padding: 0.45rem 0.7rem; border-radius: 4px; border: none; width: 260px; }
  form.busca button { padding: 0.45rem 0.9rem; border-radius: 4px; border: none; background: #2f6690; color: white; cursor: pointer; }
  form.busca button:hover { background: #3a7ba8; }
  main { padding: 1.5rem; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; color: #444; }
  ul.lista-empresas { list-style: none; padding: 0; }
  ul.lista-empresas li { background: white; margin-bottom: 0.5rem; padding: 0.8rem 1rem; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  ul.lista-empresas a { text-decoration: none; color: #163a5c; font-weight: 600; }
  .grupo-tipo { background: white; border-radius: 6px; padding: 0.8rem 1rem; margin-bottom: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .grupo-tipo h3 { text-transform: capitalize; margin: 0 0 0.5rem; color: #163a5c; }
  .doc-item { display: flex; flex-direction: column; padding: 0.4rem 0; border-bottom: 1px solid #eee; }
  .doc-item:last-child { border-bottom: none; }
  .doc-item a { color: #2f6690; text-decoration: none; }
  .doc-item a:hover { text-decoration: underline; }
  .doc-resultado { background: white; border-radius: 6px; padding: 0.8rem 1rem; margin-bottom: 0.6rem; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .trecho { color: #555; font-size: 0.88rem; margin-top: 0.3rem; }
  .vazio { color: #777; font-style: italic; }
  .voltar { display: inline-block; margin-bottom: 1rem; color: #2f6690; text-decoration: none; }
</style>
</head>
<body>
<header>
  <a class="marca" href="/">Painel de Documentos FRL</a>
  <form class="busca" action="/busca" method="get">
    <input type="text" name="q" placeholder="Buscar empresa ou conteúdo..." value="{{.TermoBusca}}">
    <button type="submit">Buscar</button>
  </form>
</header>
<main>
{{.Conteudo}}
</main>
</body>
</html>
