<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Painel de Documentos FRL</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#f2f4f6; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .caixa { background:white; padding:2rem 2.5rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1); width:280px; }
  .caixa h1 { font-size:1.15rem; margin-top:0; color:#163a5c; }
  .caixa input { width:100%; padding:0.5rem; margin-bottom:0.8rem; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:1rem; }
  .caixa button { width:100%; padding:0.6rem; border:none; border-radius:4px; background:#2f6690; color:white; cursor:pointer; font-size:1rem; }
  .caixa button:hover { background:#3a7ba8; }
  .erro { color:#b3261e; font-size:0.85rem; margin-bottom:0.8rem; }
</style>
</head>
<body>
<div class="caixa">
  <h1>Painel de Documentos FRL</h1>
  {{if .Erro}}<p class="erro">Usuário ou senha inválidos.</p>{{end}}
  <form method="post" action="/login">
    <input type="text" name="nome_usuario" placeholder="Usuário" autofocus required>
    <input type="password" name="senha" placeholder="Senha" required>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
